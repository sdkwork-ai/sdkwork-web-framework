[package]
name = "sdkwork-web-framework-admin-repository-sqlx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLx repository for web-framework admin control-plane tables (WEB_BACKEND_SPEC.md)."

[lib]
name = "sdkwork_web_framework_admin_repository_sqlx"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sdkwork-utils-rust.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
tracing.workspace = true

[features]
default = ["postgres"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dev-dependencies]
sdkwork-web-store-sqlx = { workspace = true, default-features = false, features = ["sqlite"] }
tokio = { workspace = true, features = ["rt", "macros"] }
